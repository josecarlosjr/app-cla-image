<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Intelligence Agent</title>
    <script>
      // Apply the saved theme before first paint to avoid a
      // dark->light flash on load. Mirrors src/utils/theme.ts; kept
      // tiny and dependency-free on purpose.
      (function () {
        try {
          var t = localStorage.getItem("pia-theme");
          if (t === "light")
            document.documentElement.classList.add("theme-light");
          else if (t === "sepia")
            document.documentElement.classList.add("theme-sepia");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
